# Live-reload configuration for `make dev` (github.com/air-verse/air):
# rebuild CSS, sqlc code and the binary on any source change, then restart
# the server. Templates and static assets are embedded, so a restart is
# what makes their changes visible.
root = "."
tmp_dir = ".tools/air"

[build]
  cmd = "make --no-print-directory css sqlc && go build -o .tools/air/kivraid ./cmd/kivraid"
  entrypoint = [".tools/air/kivraid", "serve", "--config", "kivraid.yaml"]
  include_ext = ["go", "html", "css", "js", "sql"]
  exclude_dir = [".git", ".tools", "dist", "docs", "fixtures", "packaging", "tools", "internal/store/sqlcgen"]
  # Generated by the build itself: watching them would loop forever.
  exclude_file = ["internal/web/static/app.css"]
  delay = 300
  stop_on_error = true
  send_interrupt = true
  kill_delay = "2s"

[log]
  time = false

[misc]
  clean_on_exit = true
