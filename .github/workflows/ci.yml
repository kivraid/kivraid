name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build CSS
        run: make css
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Check sqlc output is current
        run: |
          go run github.com/sqlc-dev/sqlc/cmd/sqlc@v1.30.0 generate
          git diff --exit-code internal/store/sqlcgen
      - name: Test
        run: go test ./...
      - name: Build
        run: make build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t kivraid:ci .
