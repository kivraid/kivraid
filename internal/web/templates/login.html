<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="csrf-token" content="{{.CSRF}}">
  <title>Sign in · Kivraid</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="/static/fonts/InterVariable.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/app.js"></script>
</head>
<body class="min-h-dvh">
  <div class="aurora"></div>
  <button type="button" class="aurora-toggle" data-theme-toggle aria-label="Toggle theme">
    <svg class="size-[18px] dark:hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
    <svg class="hidden size-[18px] dark:block" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
  </button>

  <main class="flex min-h-dvh flex-col items-center justify-center px-6 py-12">
    <div class="w-full max-w-sm">
      <div class="mb-8 flex flex-col items-center gap-4">
        <svg width="40" height="40" viewBox="0 0 24 24" aria-hidden="true">
          <rect width="24" height="24" rx="7" class="fill-accent"/>
          <circle cx="12" cy="10" r="3" fill="var(--on-accent)"/>
          <path d="M10 11.4 H14 L13 17.4 H11 Z" fill="var(--on-accent)"/>
        </svg>
        <div class="text-center">
          <h1 class="aurora-title">Sign in to Kivraid</h1>
          <p class="aurora-sub">Use your directory credentials</p>
        </div>
      </div>

      {{if .Error}}
      <div class="alert-danger mb-4" role="alert">{{.Error}}</div>
      {{end}}

      <form method="post" action="/login" class="auth-card space-y-4 p-6">
        <input type="hidden" name="_csrf" value="{{.CSRF}}">
        <input type="hidden" name="next" value="{{.Next}}">
        <div>
          <label class="label" for="username">Username or email</label>
          <input class="input" id="username" name="username" value="{{.Username}}"
                 autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus>
        </div>
        <div>
          <label class="label" for="password">Password</label>
          <input class="input" id="password" name="password" type="password"
                 autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn-primary w-full">Sign in</button>
      </form>

      <div data-passkey-login hidden class="mt-4">
        <div class="flex items-center gap-3 text-xs aurora-foot">
          <span class="h-px flex-1 bg-white/20"></span>or<span class="h-px flex-1 bg-white/20"></span>
        </div>
        <button type="button" data-passkey-login-btn data-next="{{.Next}}"
                class="btn-secondary mt-4 flex w-full items-center justify-center gap-2">
          <svg class="size-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="10" cy="8" r="4"/><path d="M10 12a6 6 0 0 0-6 6v2h8"/><circle cx="17.5" cy="14.5" r="2.5"/><path d="M17.5 17v4l1.5-1.5-1.5-1.5"/></svg>
          Sign in with a passkey
        </button>
        <p data-passkey-error class="alert-danger mt-3" role="alert" hidden></p>
      </div>

      <p class="mt-8 text-center aurora-foot">Kivraid — lightweight identity</p>
    </div>
  </main>
</body>
</html>
