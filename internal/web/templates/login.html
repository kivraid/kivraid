<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · Kivraid</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="/static/fonts/InterVariable.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/app.js"></script>
</head>
<body class="min-h-dvh">
  <div class="aurora"></div>
  <button type="button" class="btn-icon fixed right-4 top-4" data-theme-toggle aria-label="Toggle theme">
    <svg class="size-[18px] dark:hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
    <svg class="hidden size-[18px] dark:block" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
  </button>

  <main class="flex min-h-dvh flex-col items-center justify-center px-6 py-12">
    <div class="w-full max-w-sm">
      <div class="mb-8 flex flex-col items-center gap-4">
        <svg width="40" height="40" viewBox="0 0 24 24" aria-hidden="true">
          <rect width="24" height="24" rx="6" class="fill-accent"/>
          <path d="M8.5 6.5v11M15.5 7l-5.5 5 5.5 5" fill="none" stroke="var(--on-accent)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <div class="text-center">
          <h1 class="text-xl font-semibold tracking-tight">Sign in to Kivraid</h1>
          <p class="mt-1 text-sm text-muted">Use your directory credentials</p>
        </div>
      </div>

      {{if .Error}}
      <div class="alert-danger mb-4" role="alert">{{.Error}}</div>
      {{end}}

      <form method="post" action="/login" class="card space-y-4 p-6">
        <input type="hidden" name="_csrf" value="{{.CSRF}}">
        <input type="hidden" name="next" value="{{.Next}}">
        <div>
          <label class="label" for="username">Username or email</label>
          <input class="input" id="username" name="username" value="{{.Username}}"
                 autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus>
        </div>
        <div>
          <label class="label" for="password">Password</label>
          <input class="input" id="password" name="password" type="password"
                 autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn-primary w-full">Sign in</button>
      </form>

      <p class="mt-8 text-center text-xs text-faint">Kivraid — lightweight identity</p>
    </div>
  </main>
</body>
</html>
