{{define "content"}}
<div class="mb-8">
  <h1 class="text-2xl font-semibold tracking-tight">New user</h1>
  <p class="mt-1 text-sm text-muted">Creates a local account. Directory users appear automatically on their first sign-in.</p>
</div>

{{if .Data.Error}}
<div class="alert-danger mb-4" role="alert">{{.Data.Error}}</div>
{{end}}

<form method="post" action="/admin/users" class="card space-y-5 p-6">
  <input type="hidden" name="_csrf" value="{{.CSRF}}">
  <div class="grid grid-cols-1 gap-5 sm:grid-cols-2">
    <div>
      <label class="label" for="username">Username</label>
      <input class="input" id="username" name="username" value="{{.Data.Form.Username}}" autocapitalize="none" spellcheck="false" required autofocus>
    </div>
    <div>
      <label class="label" for="name">Display name</label>
      <input class="input" id="name" name="name" value="{{.Data.Form.Name}}">
    </div>
  </div>
  <div class="grid grid-cols-1 gap-5 sm:grid-cols-2">
    <div>
      <label class="label" for="email">Email</label>
      <input class="input" id="email" name="email" type="email" value="{{.Data.Form.Email}}" required>
    </div>
    <div>
      <label class="label" for="password">Initial password</label>
      <div class="relative">
        <input class="input pr-11" id="password" name="password" type="password" autocomplete="new-password" minlength="8" required data-secret>
        <button type="button" class="absolute inset-y-0 right-0 flex cursor-pointer items-center px-3 text-faint hover:text-fg" data-secret-toggle aria-label="Show password">
          <svg data-eye class="size-[18px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
          <svg data-eye-off class="hidden size-[18px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.9 4.24A9.1 9.1 0 0 1 12 4c6.5 0 10 7 10 7a13.2 13.2 0 0 1-1.67 2.68M6.1 6.1A13.2 13.2 0 0 0 2 12s3.5 7 10 7a9.1 9.1 0 0 0 5.9-2.1M14.12 14.12A3 3 0 1 1 9.88 9.88"/><path d="M2 2l20 20"/></svg>
        </button>
      </div>
    </div>
  </div>
  <label class="flex cursor-pointer items-center gap-2 text-sm">
    <input type="checkbox" name="is_admin" class="accent-accent" {{if .Data.Form.IsAdmin}}checked{{end}}> Administrator
  </label>
  <div class="flex items-center justify-end gap-3 border-t border-line pt-5">
    <a href="/admin/users" class="btn-ghost">Cancel</a>
    <button type="submit" class="btn-primary">Create user</button>
  </div>
</form>
{{end}}
