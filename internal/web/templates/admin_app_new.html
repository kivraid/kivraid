{{define "content"}}
<div class="mb-8">
  <h1 class="text-2xl font-semibold tracking-tight">New application</h1>
  <p class="mt-1 text-sm text-muted">Registers the application and its OIDC provider in one step.</p>
</div>

{{if .Data.Error}}
<div class="alert-danger mb-4" role="alert">{{.Data.Error}}</div>
{{end}}

<form method="post" action="/admin/applications" class="card space-y-5 p-6">
  <input type="hidden" name="_csrf" value="{{.CSRF}}">

  <div class="grid grid-cols-1 gap-5 sm:grid-cols-2">
    <div>
      <label class="label" for="name">Name</label>
      <input class="input" id="name" name="name" value="{{.Data.Form.Name}}" required autofocus placeholder="Grafana">
    </div>
    <div>
      <label class="label" for="slug">Slug</label>
      <input class="input" id="slug" name="slug" value="{{.Data.Form.Slug}}" placeholder="derived from name">
    </div>
  </div>

  <div>
    <label class="label" for="launch_url">Launch URL <span class="font-normal text-faint">(optional)</span></label>
    <input class="input" id="launch_url" name="launch_url" value="{{.Data.Form.LaunchURL}}" placeholder="https://grafana.example.com">
    <p class="mt-1.5 text-xs text-muted">Shown in the user portal's application launcher.</p>
  </div>

  <div>
    <label class="label" for="redirect_uris">Redirect URIs</label>
    <textarea class="textarea font-mono" id="redirect_uris" name="redirect_uris" rows="3" required
              placeholder="https://grafana.example.com/login/generic_oauth">{{.Data.Form.RedirectURIs}}</textarea>
    <p class="mt-1.5 text-xs text-muted">One per line, exact match.</p>
  </div>

  <fieldset>
    <legend class="label">Client type</legend>
    <div class="space-y-2">
      <label class="flex cursor-pointer items-start gap-3 rounded-lg border border-line p-3 transition-colors has-checked:border-accent has-checked:bg-accent-soft/40">
        <input type="radio" name="client_type" value="confidential" class="mt-0.5 accent-accent" {{if not .Data.Form.Public}}checked{{end}}>
        <span>
          <span class="block text-sm font-medium">Confidential</span>
          <span class="block text-xs text-muted">Server-side application that can keep a client secret (most web apps).</span>
        </span>
      </label>
      <label class="flex cursor-pointer items-start gap-3 rounded-lg border border-line p-3 transition-colors has-checked:border-accent has-checked:bg-accent-soft/40">
        <input type="radio" name="client_type" value="public" class="mt-0.5 accent-accent" {{if .Data.Form.Public}}checked{{end}}>
        <span>
          <span class="block text-sm font-medium">Public · PKCE</span>
          <span class="block text-xs text-muted">SPA, mobile or CLI that cannot keep a secret; PKCE is enforced.</span>
        </span>
      </label>
    </div>
  </fieldset>

  <div class="flex items-center justify-end gap-3 border-t border-line pt-5">
    <a href="/admin/applications" class="btn-ghost">Cancel</a>
    <button type="submit" class="btn-primary">Create application</button>
  </div>
</form>
{{end}}
