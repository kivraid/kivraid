<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{.Title}} · Kivraid</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="/static/fonts/InterVariable.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/app.js"></script>
</head>
<body class="min-h-dvh">
  <header class="sticky top-0 z-10 border-b border-line bg-bg/85 backdrop-blur">
    <div class="mx-auto flex h-14 w-full max-w-3xl items-center justify-between gap-4 px-6">
      <div class="flex min-w-0 items-center gap-5">
        <a href="/" class="flex shrink-0 items-center gap-2.5 text-[15px] font-semibold tracking-tight">
          {{template "logo" 24}}
          <span class="hidden sm:inline">Kivraid</span>
        </a>
        <nav class="flex items-center gap-1">
          <a href="/" class="nav-link {{if eq .Active "home"}}nav-active{{end}}">Home</a>
          <a href="/profile" class="nav-link {{if eq .Active "profile"}}nav-active{{end}}">Profile</a>
          <a href="/sessions" class="nav-link {{if eq .Active "sessions"}}nav-active{{end}}">Sessions</a>
        </nav>
      </div>

      <div class="flex shrink-0 items-center gap-1.5">
        {{if .User.IsAdmin}}
        <div class="relative" data-menu>
          <button type="button" data-menu-button
                  class="nav-link flex items-center gap-1 {{if or (eq .Active "apps") (eq .Active "ldap") (eq .Active "users") (eq .Active "groups") (eq .Active "audit")}}nav-active{{end}}">
            Admin
            <svg class="size-3.5 text-faint" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
          </button>
          <div class="menu-panel">
            <a href="/admin/applications" class="menu-item {{if eq .Active "apps"}}bg-raised{{end}}">Applications</a>
            <a href="/admin/ldap" class="menu-item {{if eq .Active "ldap"}}bg-raised{{end}}">Directories</a>
            <a href="/admin/users" class="menu-item {{if eq .Active "users"}}bg-raised{{end}}">Users</a>
            <a href="/admin/groups" class="menu-item {{if eq .Active "groups"}}bg-raised{{end}}">Groups</a>
            <div class="menu-divider"></div>
            <a href="/admin/audit" class="menu-item {{if eq .Active "audit"}}bg-raised{{end}}">Activity</a>
          </div>
        </div>
        {{end}}

        <div class="relative" data-menu>
          <button type="button" data-menu-button class="flex cursor-pointer items-center gap-2 rounded-lg p-1 pr-1.5 transition-colors hover:bg-raised" aria-label="Account menu">
            {{if .User.PhotoMime}}
            <img class="size-8 rounded-full object-cover" src="/avatar/{{.User.ID}}" alt="">
            {{else}}
            <span class="avatar">{{initials .User.Name}}</span>
            {{end}}
            <svg class="size-3.5 text-faint" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
          </button>
          <div class="menu-panel">
            <div class="px-3 py-2">
              <div class="truncate text-sm font-medium">{{.User.Name}}</div>
              <div class="truncate text-xs text-muted">{{.User.Email}}</div>
            </div>
            <div class="menu-divider"></div>
            <button type="button" class="menu-item" data-theme-toggle>
              <svg class="size-4 dark:hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
              <svg class="hidden size-4 dark:block" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
              Switch theme
            </button>
            <div class="menu-divider"></div>
            <form method="post" action="/logout">
              <input type="hidden" name="_csrf" value="{{.CSRF}}">
              <button type="submit" class="menu-item">
                <svg class="size-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
                Sign out
              </button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </header>
  <main class="mx-auto w-full max-w-3xl px-6 py-10">
    {{block "content" .}}{{end}}
  </main>
</body>
</html>

{{define "logo"}}
<svg width="{{.}}" height="{{.}}" viewBox="0 0 24 24" aria-hidden="true">
  <rect width="24" height="24" rx="6" class="fill-accent"/>
  <path d="M8.5 6.5v11M15.5 7l-5.5 5 5.5 5" fill="none" stroke="var(--on-accent)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
{{end}}
