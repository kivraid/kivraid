<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{.Title}} · Kivraid</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/app.js"></script>
</head>
<body class="min-h-dvh">
  <div class="aurora"></div>
  <main class="flex min-h-dvh flex-col items-center justify-center px-6 py-12">
    <div class="flex w-full max-w-md flex-col items-center gap-4 text-center">
      <svg width="40" height="40" viewBox="0 0 24 24" aria-hidden="true">
        <rect width="24" height="24" rx="7" class="fill-accent"/>
          <circle cx="12" cy="10" r="3" fill="var(--on-accent)"/>
          <path d="M10 11.4 H14 L13 17.4 H11 Z" fill="var(--on-accent)"/>
      </svg>
      <div>
        <p class="font-mono text-sm text-white/60">{{.Code}}</p>
        <h1 class="mt-1 aurora-title">{{.Title}}</h1>
        <p class="mt-2 text-sm text-white/70">{{.Message}}</p>
      </div>
      <a href="/" class="btn-secondary mt-2">Back to home</a>
    </div>
  </main>
</body>
</html>
