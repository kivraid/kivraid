<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{.Title}} · Kivraid</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/app.js"></script>
</head>
<body class="min-h-dvh">
  <div class="aurora"></div>
  <main class="flex min-h-dvh flex-col items-center justify-center px-6 py-12">
    <div class="flex w-full max-w-md flex-col items-center gap-4 text-center">
      <svg width="40" height="40" viewBox="0 0 24 24" aria-hidden="true">
        <rect width="24" height="24" rx="6" class="fill-accent"/>
        <path d="M8.5 6.5v11M15.5 7l-5.5 5 5.5 5" fill="none" stroke="var(--on-accent)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <div>
        <p class="font-mono text-sm text-faint">{{.Code}}</p>
        <h1 class="mt-1 text-xl font-semibold tracking-tight">{{.Title}}</h1>
        <p class="mt-2 text-sm text-muted">{{.Message}}</p>
      </div>
      <a href="/" class="btn-primary mt-2">Back to home</a>
    </div>
  </main>
</body>
</html>
